[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentos"
version = "0.2.0"
description = "Production-oriented open-source multi-agent operating system runtime"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "typer>=0.12,<1",
  "rich>=13.9,<14",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "sqlalchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29,<1", "psycopg[binary]>=3.2,<4"]
vector = ["pgvector>=0.3,<1"]
redis = ["redis>=5,<6"]
mcp = ["mcp>=1,<2"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<6",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "pyright>=1.1,<2",
  "pre-commit>=4,<5",
  "tach>=0.35,<1",
]

[project.scripts]
agentos = "agentos.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=agentos --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","F","I","B","UP","SIM","ASYNC","S"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
plugins = []

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
