repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
  - repo: local
    hooks:
      - id: tach
        name: tach
        description: Enforce module boundaries defined in tach.toml
        entry: tach check
        language: system
        pass_filenames: false
